name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual trigger. Useful for re-running the extension-host gate without
  # inventing a commit, and for checking the workflow itself after editing it:
  # `gh workflow run ci.yml` then `gh run watch`.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      # The extension-host gate, on every push and PR — not only at release time.
      #
      # It earns its place here because it is the only check that can see defects
      # that live in the extension host rather than in a module: the first thing it
      # ever ran caught `SettingsView` notifying the worker before persisting the
      # new setting, so the worker read the OLD value and deleted the auto-sync
      # alarm the user had just switched on. Unit tests, typecheck and lint were all
      # green on that commit, and would stay green on a regression that only a real
      # service worker plus real `chrome.alarms` can expose (AGENTS rule 28).
      #
      # Measured 3.5 s on Windows; on the runner the cost is browser start plus
      # Xvfb. If it ever becomes flaky, treat that as a finding about the gate —
      # do not delete it to make a red build go away.
      - name: Ensure Chrome and Xvfb are available
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_bin" ]; then
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
            chrome_bin="$(command -v google-chrome-stable)"
          fi
          echo "chrome binary: $chrome_bin"
          "$chrome_bin" --version

      - name: Extension E2E gate
        run: xvfb-run -a node e2e/release-gate.mjs
