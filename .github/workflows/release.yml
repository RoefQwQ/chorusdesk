name: Release

# Tag-driven: `npm version patch|minor|major` then `git push --follow-tags`.
# WXT reads the version from package.json (wxt.config.ts deliberately does not
# override it), so the manifest, the tag and the artifact name all come from that
# one field — and the "Verify tag" step refuses to publish if they disagree.
#
# A release also needs `docs/releases/vX.Y.Z.md` (its GitHub release body). Write
# it BEFORE `npm version`, which commits the bump: the workflow fails the build if
# the file for the new version is missing or is a stub. See PUBLISHING.md §5.1.1.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gates as CI: a release must never be the first place a broken
      # build is discovered.
      #
      # `test:coverage`, not `test` — the per-file branch thresholds in
      # vitest.config.ts apply ONLY when coverage runs, so `npm test` silently
      # dropped the ratchet that protects the three modules whose bugs corrupt
      # user data. `tests/workflows.gateParity.test.ts` now fails if this list and
      # CI's diverge, so the two cannot drift apart again unnoticed.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with core-module coverage ratchet)
        run: npm run test:coverage

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Run 'npm version ${GITHUB_REF_NAME#v}' and push the resulting tag."
            exit 1
          fi

      # The release body is a FILE IN THE REPO, and this step is what makes its
      # absence a failure rather than a silent empty page.
      #
      # It is not `--generate-notes`: with no earlier tag to diff, the first
      # release got a body of exactly one line (「Full Changelog」 + a commits URL)
      # and said nothing about what the build does. It is not `--notes-from-tag`
      # either, which was the first attempt: `npm version` — the release command
      # documented at the top of this file — writes a tag message containing just
      # the version number, so that body would have read 「1.1.0」. Verified by
      # running `npm version` in a scratch repo.
      #
      # A file is reviewable in the same commit as the version bump, carries real
      # prose, and — unlike either flag — can be checked for existence before the
      # build runs. Checking here rather than at publish time is deliberate: this
      # fails in ~10 seconds, where the publish step would fail after the unit
      # tests, the E2E gate and the packaging.
      - name: Verify the release notes exist
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes — every release ships notes. Copy the previous release's file, rewrite it for this version, and commit it with the version bump."
            ls docs/releases/ || true
            exit 1
          fi
          chars=$(tr -d '[:space:]' < "$notes" | wc -c)
          if [ "$chars" -lt 200 ]; then
            echo "::error::$notes has only ${chars} non-space characters — a release body that says nothing is the defect this check exists to catch."
            exit 1
          fi
          echo "$notes: ${chars} non-space characters"

      - name: Build and package
        run: npm run zip

      # The extension-host gate: loads the built extension into its own Chrome
      # (isolated profile, off-screen) and drives the three flows no unit test
      # can reach — backup export as a real download, import through the real
      # file input, and the auto-sync alarm surviving popup opens and a cold
      # service-worker restart. See e2e/release-gate.mjs and AGENTS rule 28.
      #
      # It needs a display, so it runs under Xvfb. Both Chrome and xvfb-run are
      # present on the runner image; the fallbacks are insurance for a future
      # image change, not the normal path.
      #
      # Run this before tagging with the workflow_dispatch button if you want to
      # check the gate itself: a tag-push failure means the diagnosis happens
      # during a release.
      - name: Ensure Chrome and Xvfb are available
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_bin" ]; then
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
            chrome_bin="$(command -v google-chrome-stable)"
          fi
          echo "chrome binary: $chrome_bin"
          "$chrome_bin" --version

      - name: Extension E2E gate
        # `-s` matters: xvfb-run's default screen is 1280x1024, and the gate's
        # window is 1440x900 — WIDER than the screen. Chrome then centres it at
        # x = -80, so the left edge of the page (where the nav tabs are) is off the
        # display and synthetic clicks there are dropped by the X server:
        # `Input.dispatchMouseEvent` returns success, the page receives nothing
        # (mousedown=0 mouseup=0 click=0). That produced weeks of intermittent CI
        # failures that never reproduced locally, where the screen is wider.
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node e2e/release-gate.mjs

      - name: Name the artifact for the download page
        run: |
          version=$(node -p "require('./package.json').version")
          pkg=$(node -p "require('./package.json').name")
          mkdir -p dist
          # README documents `chorus-vX.X.X.zip`; WXT emits `<name>-<version>-chrome.zip`.
          cp ".output/${pkg}-${version}-chrome.zip" "dist/chorus-v${version}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chorus-extension
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publishing survives an intermittently failing releases endpoint.
          #
          # Measured on this repository while writing this step: `POST /releases`
          # returns HTTP 500 roughly one attempt in three — and the release IS
          # created anyway, so `gh` exits non-zero having already made it. That is
          # why the plain one-liner this replaces failed the step on three
          # consecutive tag runs and left a draft behind each time.
          #
          # It is not `--generate-notes`: an A/B of that flag against a literal
          # `--notes` set gave 3/3 success for BOTH, interleaved through the same
          # errors. Reads stayed fine and the rate limit was untouched, so this is
          # GitHub-side. We cannot prevent it; we only have to survive it.
          #
          # The body comes from `docs/releases/<tag>.md`, which the step above
          # has already proved exists and is not a stub. Neither built-in flag
          # works here: `--generate-notes` produced a one-line body on the first
          # release (no earlier tag to diff against), and `--notes-from-tag` would
          # print just the version number, because that is all `npm version` puts
          # in the tag message.
          #
          # An existing release keeps its body: a re-run over an already-published
          # tag must not rewrite what users may already have read.
          #
          # So the step is a converging state machine rather than a single call.
          # Each pass makes progress on whatever state the tag is in, and the exit
          # condition is OBSERVED (a published release carrying the asset), never an
          # exit code.
          #
          # Two traps, both hit for real while building this:
          #  - `releases/tags/<tag>` answers 404 for a DRAFT, and everything here is
          #    a draft until published. Guarding creation with it made the loop
          #    create FIVE duplicate drafts in one run.
          #  - the list endpoint is NEWEST-first, so picking `head -1` selects the
          #    most recent empty draft, not the older one already holding the asset.
          set -u
          tag="${GITHUB_REF_NAME}"
          asset="dist/chorus-v${tag#v}.zip"
          attempts=20

          # The single target release for this tag: the PUBLISHED one if any,
          # otherwise the OLDEST draft (the one created first, which is the one an
          # earlier pass may already have attached the asset to).
          #
          # Returning one id used by every branch is what makes the loop converge.
          # An earlier version computed "any" and "published" separately, so a pass
          # could upload to the oldest draft while testing a newer one and create
          # yet another — it published correctly but left a stray draft behind.
          # Every read below MUST tolerate failure. GitHub's runner executes a
          # `run:` block as `bash -e`, and `-e` kills the script on ANY failing
          # command — including a command substitution in an assignment. A
          # transient 5xx here is not an error condition; it is the reason the
          # retry loop exists. Without the guards, that loop could never retry:
          # the first failed probe ended the step.
          #
          # Measured on the v1.0.1 release: the release was created, the asset
          # attached and the tag published correctly, and the step STILL exited 1
          # with no error line — it died at a probe after `sleep 5`, so users saw
          # a red X on a successful release. Reproduced by running this exact
          # script under `bash -e` with a stub `gh` that fails one read.
          target_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases" --jq "
              [ .[] | select(.tag_name == \"${tag}\") ] as \$r
              | ( \$r | map(select(.draft == false)) | .[0]
                  // \$r | sort_by(.id) | .[0] )
              | .id // empty" 2>/dev/null || true
          }
          published_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == \"${tag}\") | select(.draft == false) | .id" 2>/dev/null | head -1 || true
          }
          asset_names() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/$1" --jq '.assets[].name' 2>/dev/null || true
          }

          ok=0
          for i in $(seq 1 "$attempts"); do
            # A 5xx READ is not evidence of absence. `target_id` returning empty
            # during a 500/502 made an earlier version create a duplicate draft
            # alongside the release it had just made (measured: two releases for
            # v1.0.0, created one second apart). Re-read before believing "none".
            target=""
            for probe in 1 2 3 4 5; do
              target=$(target_id)
              [ -n "$target" ] && break
              sleep 3
            done
            pub=$(published_id)

            if [ -n "$pub" ] && [ -n "$(asset_names "$pub")" ]; then
              echo "published with asset (pass ${i})"
              ok=1
              break
            fi

            if [ -n "$target" ]; then
              # A release exists (draft, or published without its asset yet).
              # Never create a second one for this tag.
              if [ -z "$(asset_names "$target")" ]; then
                gh release upload "$tag" "$asset" --clobber || true
              fi
              if [ -z "$pub" ]; then
                gh release edit "$tag" --draft=false || true
              fi
            else
              # NOTE: this may report HTTP 500 and still create the release. The
              # next pass finds it via `target_id` and continues from there, so a
              # spurious failure costs one pass rather than the whole release.
              gh release create "$tag" "$asset" \
                --title "Chorus ${tag}" \
                --notes-file "docs/releases/${tag}.md" --draft || true
            fi

            sleep 5
          done

          # Delete every DRAFT left for this tag, keeping the published one.
          #
          # This is the deterministic half, and it replaces an attempt to make the
          # create path race-free. GitHub's endpoint 5xxs while still creating the
          # release, so "did I already create this?" cannot be answered reliably at
          # the moment of creating — a read that fails during the same outage looks
          # identical to "no release yet". Rather than keep tightening that guess,
          # the loop only has to guarantee that ONE release ends up published, and
          # this sweeps whatever duplicates the retries left behind.
          #
          # Side effect worth having: a re-run over an already-published tag is also
          # left clean, which is what a tag re-push after a failure produces.
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${tag}\") | select(.draft == true) | .id" 2>/dev/null || true); do
            echo "removing leftover draft ${id}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" -X DELETE || true
          done

          if [ "$ok" != "1" ]; then
            echo "::error::the ${tag} release is not published with its asset after ${attempts} passes"
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.tag_name == "'"${tag}"'") | "\(.id) draft=\(.draft) assets=\([.assets[].name] | join(","))"' || true
            exit 1
          fi
          # The same guard as the helpers, and for the same reason: this is the
          # LAST command, so an unguarded failure here exits 1 after the release
          # has already gone public. `published_id` returning empty would even
          # build a URL ending in `/releases/`, which 404s.
          gh api "repos/${GITHUB_REPOSITORY}/releases/$(published_id)" \
            --jq '"released \(.tag_name): assets=\([.assets[].name] | join(", "))"' || true
