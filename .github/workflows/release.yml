name: Release

# Tag-driven: `npm version patch|minor|major` then `git push --follow-tags`.
# WXT reads the version from package.json (wxt.config.ts deliberately does not
# override it), so the manifest, the tag and the artifact name all come from that
# one field — and the "Verify tag" step refuses to publish if they disagree.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gates as CI: a release must never be the first place a broken
      # build is discovered.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Run 'npm version ${GITHUB_REF_NAME#v}' and push the resulting tag."
            exit 1
          fi

      - name: Build and package
        run: npm run zip

      # The extension-host gate: loads the built extension into its own Chrome
      # (isolated profile, off-screen) and drives the three flows no unit test
      # can reach — backup export as a real download, import through the real
      # file input, and the auto-sync alarm surviving popup opens and a cold
      # service-worker restart. See e2e/release-gate.mjs and AGENTS rule 28.
      #
      # It needs a display, so it runs under Xvfb. Both Chrome and xvfb-run are
      # present on the runner image; the fallbacks are insurance for a future
      # image change, not the normal path.
      #
      # Run this before tagging with the workflow_dispatch button if you want to
      # check the gate itself: a tag-push failure means the diagnosis happens
      # during a release.
      - name: Ensure Chrome and Xvfb are available
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi
          (command -v google-chrome || command -v google-chrome-stable) --version

      - name: Extension E2E gate
        run: xvfb-run -a node e2e/release-gate.mjs

      - name: Name the artifact for the download page
        run: |
          version=$(node -p "require('./package.json').version")
          pkg=$(node -p "require('./package.json').name")
          mkdir -p dist
          # README documents `chorus-vX.X.X.zip`; WXT emits `<name>-<version>-chrome.zip`.
          cp ".output/${pkg}-${version}-chrome.zip" "dist/chorus-v${version}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chorus-extension
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
